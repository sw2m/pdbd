# Privileged daemons resolve their binary unprivileged ($(command -v …)) and
# sudo-exec the absolute, read-only store path — no PATH crosses sudo. Resources
# live in the per-run $PDBD_DIR / $PDBD_NS.
processes:
  socat:
    command: "socat PTY,link=$PDBD_DIR/a,raw,echo=0 PTY,link=$PDBD_DIR/b,raw,echo=0"
    disabled: true
  pppd:
    command: "sudo -n $(command -v pppd) $(readlink -f $PDBD_DIR/b) 115200 noauth local nodetach nocrtscts novj noccp lcp-echo-interval 0 unit $PDBD_UNIT 10.0.0.2:10.0.0.1"
    disabled: true
  linkup:
    command: "sudo -n $(command -v ip) netns exec $PDBD_NS $(cat $PDBD_DIR/linkup) $(readlink -f $PDBD_DIR/a) 10.0.0.1 10.0.0.2 pdbd0"
    disabled: true
