# CI background services (process-compose) — see README "Local development".
# sudo resets PATH, so the privileged daemons run `sudo env PATH=$PATH …` to reach
# the nix-provided pppd/ip rather than a host copy.
processes:
  socat:
    command: "socat PTY,link=/tmp/pdbd-a,raw,echo=0 PTY,link=/tmp/pdbd-b,raw,echo=0"
    disabled: true
  pppd:
    command: "sudo -n env PATH=$PATH pppd $(readlink -f /tmp/pdbd-b) 115200 noauth local nodetach nocrtscts novj noccp lcp-echo-interval 0 10.0.0.2:10.0.0.1"
    disabled: true
  linkup:
    command: "sudo -n env PATH=$PATH ip netns exec pdbd $(cat /tmp/pdbd-linkup) $(readlink -f /tmp/pdbd-a) 10.0.0.1 10.0.0.2 pdbd0"
    disabled: true
