syntax = "proto3";

package pdbd.v1;

import "pdbd/v1/common.proto";

message ForwardRequest {
  oneof bind {
    Endpoint client = 1;
    Endpoint daemon = 2;
  }
  Endpoint target = 3;
}

message ForwardResponse {
  uint64 id = 1;
}

message SocatRequest {
  string left = 1;
  string right = 2;
}
