syntax = "proto3";

package pdbd.v1;

import "pdbd/v1/common.proto";

message ForwardRequest {
  oneof bind {
    Endpoint bind_client = 1;
    Endpoint bind_daemon = 2;
  }
  oneof forward {
    Endpoint forward_client = 3;
    Endpoint forward_daemon = 4;
  }
}

message ForwardResponse {
  uint64 id = 1;
}

message SocatRequest {
  string left = 1;
  string right = 2;
}
