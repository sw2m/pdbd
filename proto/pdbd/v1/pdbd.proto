syntax = "proto3";

// Control-plane wire contract — schema only. All semantics (the RPC surface, the
// event protocol, request/field meanings, versioning) are documented in the README
// (§"Control plane"); see also sw2m/pdbd#2.
package pdbd.v1;

service ControlService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Exec(ExecRequest) returns (stream CommandEvent);
  rpc Shell(ShellRequest) returns (stream CommandEvent);
  rpc Resize(ResizeRequest) returns (ResizeResponse);
  rpc Forward(ForwardRequest) returns (stream TunnelEvent);
  rpc Bind(BindRequest) returns (stream TunnelEvent);
  rpc Socat(SocatRequest) returns (stream TunnelEvent);
  rpc Drop(DropRequest) returns (DropResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message HelloRequest {
  string implementation = 1;
  uint32 wire_version = 2;
  repeated string features = 3;
}

message HelloResponse {
  string implementation = 1;
  uint32 wire_version = 2;
  repeated string features = 3;
}

enum TunnelKind {
  TUNNEL_KIND_UNSPECIFIED = 0;
  TUNNEL_KIND_EXEC = 1;
  TUNNEL_KIND_SHELL = 2;
  TUNNEL_KIND_FORWARD = 3;
  TUNNEL_KIND_BIND = 4;
  TUNNEL_KIND_SOCAT = 5;
}

enum TunnelAction {
  TUNNEL_ACTION_UNSPECIFIED = 0;
  TUNNEL_ACTION_CONNECT = 1;
  TUNNEL_ACTION_ACCEPT = 2;
}

message Endpoint {
  string host = 1;
  uint32 port = 2;
}

message Tunnel {
  uint64 id = 1;
  TunnelKind kind = 2;
  TunnelAction action = 3;
  Endpoint endpoint = 4;
}

message ExecRequest {
  repeated string argv = 1;
  repeated EnvVar env = 2;
  string cwd = 3;
  bool clear_env = 4;
}

message ShellRequest {
  repeated string argv = 1;
  repeated EnvVar env = 2;
  string cwd = 3;
  bool clear_env = 4;
  PtySize pty = 5;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message PtySize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ResizeRequest {
  uint64 tunnel_id = 1;
  PtySize pty = 2;
}

message ResizeResponse {}

message CommandEvent {
  oneof event {
    Tunnel opened = 1;
    Exited exited = 2;
    Error error = 3;
  }
}

message Exited {
  int32 code = 1;
  int32 signal = 2;
}

message ForwardRequest {
  Endpoint listen = 1;
  Endpoint target = 2;
}

message BindRequest {
  Endpoint listen = 1;
  Endpoint target = 2;
}

message SocatRequest {
  string left = 1;
  string right = 2;
}

message TunnelEvent {
  oneof event {
    Tunnel opened = 1;
    TunnelClosed closed = 2;
    Error error = 3;
  }
}

message TunnelClosed {
  uint64 id = 1;
  string reason = 2;
}

message DropRequest {
  uint64 id = 1;
}

message DropResponse {}

message ListRequest {}

message ListResponse {
  repeated TunnelInfo tunnels = 1;
}

message TunnelInfo {
  uint64 id = 1;
  TunnelKind kind = 2;
  Endpoint endpoint = 3;
}

message Error {
  uint32 code = 1;
  string message = 2;
}
