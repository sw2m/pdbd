# Transport datapath test (#12-A). Run through `ci` (the scheduler must be up,
# and it exports $PDBD_DIR/$PDBD_NS/$PDBD_UNIT), not bare `lefthook run transport`.
# No pipefail — lefthook runs `run` under POSIX sh.
transport:
  piped: true
  jobs:
    - name: build
      run: |
        set -eu
        cargo build -q -p transport --example linkup
        find "$(git rev-parse --show-toplevel)/target" -type f -name linkup -path '*debug/examples*' | head -1 > "$PDBD_DIR/linkup"
        [ -s "$PDBD_DIR/linkup" ]
    - name: loop
      env:
        N: 10 # from-scratch sample floor; override with N_OVERRIDE
      run: |
        set -eu
        N=${N_OVERRIDE:-$N}
        pass=0
        for n in $(seq 1 "$N"); do
          log="$PDBD_DIR/attempt.$n.log"
          if lefthook run attempt >"$log" 2>&1; then
            pass=$((pass + 1))
            echo "run $n: PASS"
          else
            echo "run $n: FAIL"
            echo "--- attempt $n diagnostics ---"
            cat "$log"
            echo "--- end attempt $n ---"
          fi
        done
        lefthook run teardown >/dev/null 2>&1 || true
        echo "PING: $pass/$N PASS"
        [ "$pass" = "$N" ]

# one attempt, decomposed per daemon — the scheduler holds each daemon across jobs
attempt:
  piped: true
  jobs:
    - { name: clean, run: lefthook run teardown }
    - name: socat
      run: |
        set -eu
        services process start socat
        for _ in $(seq 1 10); do [ -e "$PDBD_DIR/a" ] && [ -e "$PDBD_DIR/b" ] && exit 0; sleep 0.3; done
        exit 1
    - name: pppd
      run: |
        set -eu
        services process start pppd
        for _ in $(seq 1 10); do [ -e "/sys/class/net/ppp$PDBD_UNIT" ] && exit 0; sleep 0.5; done
        exit 1
    - name: linkup
      run: |
        set -eu
        sudo -n "$(command -v ip)" netns add "$PDBD_NS"
        services process start linkup
        for _ in $(seq 1 15); do ip -4 addr show "ppp$PDBD_UNIT" 2>/dev/null | grep -q 10.0.0.2 && exit 0; sleep 1; done
        exit 1
    - { name: ping, run: ping -c3 -W2 10.0.0.1 >/dev/null 2>&1 }

teardown:
  jobs:
    - name: teardown
      run: |
        services process stop linkup >/dev/null 2>&1 || true
        services process stop pppd   >/dev/null 2>&1 || true
        services process stop socat  >/dev/null 2>&1 || true
        sudo -n "$(command -v ip)" netns del "$PDBD_NS" 2>/dev/null || true
