# Privileged transport datapath test (#12-A, test stage) — merged into lefthook.yml
# via extends. The socat/pppd/linkup daemons run under the process-compose
# scheduler (services.yml), which the `ci` wrapper boots as lefthook's sibling so
# they outlive a job; this test drives them as a client (`services process
# start/stop`). The netns is a kernel resource the scheduler does not own, so it is
# created/removed here. No pipefail — lefthook runs `run` under POSIX sh. Run only
# through `ci` (e.g. `ci test`), never bare `lefthook run transport`: the scheduler
# must already be up.
transport:
  jobs:
    - name: build
      run: |
        set -eu
        cargo build -q -p transport --example linkup
        find "$(git rev-parse --show-toplevel)/target" -type f -name linkup -path '*debug/examples*' | head -1 > /tmp/pdbd-linkup
        [ -s /tmp/pdbd-linkup ]
    - name: loop
      env:
        N: 10 # from-scratch sample floor; override with N_OVERRIDE
      run: |
        set -eu
        N=${N_OVERRIDE:-$N}
        teardown() {
          services process stop linkup >/dev/null 2>&1 || true
          services process stop pppd   >/dev/null 2>&1 || true
          services process stop socat  >/dev/null 2>&1 || true
          sudo -n ip netns del pdbd 2>/dev/null || true
        }
        attempt() {
          teardown # start this attempt from a clean slate
          sudo -n ip netns add pdbd
          services process start socat >/dev/null 2>&1
          i=0
          while [ "$i" -lt 10 ]; do
            [ -e /tmp/pdbd-a ] && [ -e /tmp/pdbd-b ] && break
            sleep 0.3; i=$((i + 1))
          done
          services process start pppd >/dev/null 2>&1
          sleep 2
          services process start linkup >/dev/null 2>&1
          up=no
          for _ in $(seq 1 15); do
            if ip -4 addr show ppp0 2>/dev/null | grep -q 10.0.0.2; then up=yes; break; fi
            sleep 1
          done
          [ "$up" = yes ] || return 1
          ping -c3 -W2 10.0.0.1 >/dev/null 2>&1 || return 1
        }
        teardown # clear any crashed prior state
        pass=0
        for n in $(seq 1 "$N"); do
          if attempt; then
            pass=$((pass + 1))
            echo "run $n: PASS"
          else
            echo "run $n: FAIL"
          fi
          teardown # tear this attempt down so the next starts clean
        done
        echo "PING: $pass/$N PASS"
        [ "$pass" = "$N" ]
