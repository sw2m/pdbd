# #71 — see README "Benchmarks"
templates:
  nixsh: nix develop "$(git rev-parse --show-toplevel)#benchmark" --no-update-lock-file -c sh

benchmark:
  piped: true
  jobs:
    - name: build
      tags:
        - privileged
      run: |
        set -eu
        dir=${DIR:-$(dirname "$LEFTHOOK_CONFIG")}
        artifacts=$(yq -p toml -o tsv '.artifacts // {} | to_entries | .[] | [.key, .value]' "$dir/bench/bench.toml")
        while IFS="$(printf '\t')" read -r name path; do
          [ -n "$name" ] && [ -f "$dir/examples/$name.rs" ] || continue
          {nixsh} -c '
            set -eu
            target=$MUSL_TARGET
            [ "${BENCH_LIBC:-musl}" = musl ] || target=$GNU_TARGET RUSTFLAGS="-C target-feature=+crt-static"
            cargo build --release --locked -p "$1" --example "$2" --target "$target"
            cp "${CARGO_TARGET_DIR:-target}/$target/release/examples/$2" "$3"
          ' _ "$(basename "$dir")" "$name" "$dir/bench/$path"
        done <<END
        $artifacts
        END
        {nixsh} -c 'ln -sfn "$BENCH_FIXTURE" "$1/bench/fixture"' _ "$dir"
        resolved=$(yq -p toml -o tsv '.resolved // ""' "$dir/bench/bench.toml")
        runner=$(yq -p toml -o tsv '.fixture.runner' "$dir/bench/bench.toml")
        [ -z "$resolved" ] || {nixsh} -c 'python3 "$1/bench/fixture/$2/resolve" "$1/bench" > "$1/bench/$3"' _ "$dir" "$runner" "$resolved"
    - name: incus
      tags:
        - privileged
      run: |
        set -eu
        if command -v incus >/dev/null && sg incus-admin -c true 2>/dev/null; then exit 0; fi
        {nixsh} -c 'sudo -n "$BENCH_SETUP" "$(id -un)"'
    - name: run
      tags:
        - privileged
      run: |
        set -eu
        bench=${DIR:-$(dirname "$LEFTHOOK_CONFIG")}/bench
        rm -f "$bench/report.json"
        bencher=$({nixsh} -c 'command -v bencher')
        status=0
        sg incus-admin -c "'$bencher' run '$bench' --out '$bench/report.json'" || status=$?
        [ ! -s "$bench/report.json" ] || {nixsh} -c 'jq -r -f "$1/report.jq" "$1/report.json"' _ "$bench" >>"${BENCHMARK_REPORT:-/dev/stdout}"
        exit "$status"
