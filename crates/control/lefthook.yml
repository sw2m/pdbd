build:
  jobs:
    - name: cargo
      root: "crates/control/"
      run: 'nix develop --no-update-lock-file "path:$PWD" -c cargo build -p control --locked'
build:update:
  jobs:
    - name: rebuild
      root: "crates/control/"
      run: 'nix develop "path:$PWD" -c cargo build -p control --locked'
test:
  jobs:
    - name: cargo
      run: cargo test -p control --locked
