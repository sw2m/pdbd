test:datapath:
  piped: true
  jobs:
    - { name: preflight, run: lefthook run test:privileged }
    - name: unit
      run: |
        set -eu
        runner=env; [ "$(id -u)" != 0 ] && runner="sudo -n env PATH=$PATH"
        cargo test -p transport --locked --lib --config "target.'cfg(all())'.runner='$runner'" -- --ignored
    - name: fixtures
      root: "crates/transport/"
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        for u in systemd/*.service; do
          minijinja-cli -D ip="$(command -v ip)" -D socat="$(command -v socat)" -D pppd="$(command -v pppd)" -D sh="$(command -v sh)" -D envfile="$PWD/.env" "$u" \
            | $sudo tee "/run/systemd/system/$(basename "$u")" >/dev/null
        done
        $sudo systemctl daemon-reload
    - name: build
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        cargo build -q -p transport --example linkup
        bin=$(find "$(cargo metadata --no-deps --format-version 1 | yq -p json .target_directory)" -type f -name linkup -path '*debug/examples*' | head -1)
        [ -n "$bin" ]
        $sudo install -d -m0755 /run/pdbd
        printf 'LINKUP=%s\n' "$bin" | $sudo tee /run/pdbd/linkup.env >/dev/null
    - name: fanout
      run: |
        set -eu
        N=${N:-10} # rig's from-scratch campaign sample
        pids=""
        for s in $(seq 0 $(( N - 1 ))); do SLOT=$s lefthook run test:attempt & pids="$pids $!"; done
        rc=0; for p in $pids; do wait "$p" || rc=1; done
        N=$N lefthook run test:teardown >/dev/null 2>&1 || true # catch-all: reclaim a slot whose attempt failed before its own `down`
        [ "$rc" = 0 ]

test:attempt:
  piped: true
  jobs:
    - name: up
      root: "crates/transport/" # cwd so linkup's dotenvy reads crates/transport/.env
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        ns="/var/run/netns/pdbd.${SLOT}"
        $sudo systemctl start "pdbd.netns@${SLOT}.service" "pdbd.pppd@${SLOT}.service"
        for _ in $(seq 1 100); do ip link show "ppp${SLOT}" >/dev/null 2>&1 && break; sleep 0.1; done # #24
        ip link show "ppp${SLOT}" >/dev/null 2>&1 || { echo "slot ${SLOT}: pppd never opened its tty"; exit 1; }
        $sudo nsenter --net="$ns" ip link set lo up
        . /run/pdbd/linkup.env
        $sudo sh -c 'exec nsenter --net="$1" "$2" "/run/pdbd/$3/a" "10.0.$3.1" "10.0.$3.2" pdbd0 >"/run/pdbd/linkup.$3.log" 2>&1' _ "$ns" "$LINKUP" "$SLOT" </dev/null >/dev/null 2>&1 &
    - name: run
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        for _ in $(seq 1 20); do
          $sudo nsenter --net="/var/run/netns/pdbd.${SLOT}" ping -c1 -W1 "10.0.${SLOT}.2" >/dev/null 2>&1 && { echo "slot ${SLOT}: PASS"; exit 0; }
          sleep 0.5
        done
        echo "slot ${SLOT}: FAIL"
        echo "--- slot ${SLOT}: linkup"; $sudo cat "/run/pdbd/linkup.${SLOT}.log" 2>/dev/null || true
        echo "--- slot ${SLOT}: pppd"; $sudo journalctl --no-pager -u "pdbd.pppd@${SLOT}" 2>/dev/null | tail -60 || true
        exit 1
    - name: tcp
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        far="10.0.${SLOT}.2"
        dir=$(mktemp -d); trap 'rm -rf "$dir"' EXIT
        head -c 65536 /dev/urandom >"$dir/sent" # ~44 MRU-sized segments
        timeout 30 socat "TCP-LISTEN:7777,bind=${far},reuseaddr" EXEC:cat </dev/null >/dev/null 2>&1 &
        for _ in $(seq 1 50); do [ -n "$(ss -Hltn "src ${far}:7777")" ] && break; sleep 0.1; done
        timeout 20 $sudo nsenter --net="/var/run/netns/pdbd.${SLOT}" socat -t 10 - "TCP:${far}:7777" <"$dir/sent" >"$dir/got" || true
        cmp -s "$dir/sent" "$dir/got" && { echo "slot ${SLOT}: TCP PASS"; exit 0; }
        echo "slot ${SLOT}: TCP FAIL (echoed $(wc -c <"$dir/got") of 65536 bytes)"
        exit 1
    - name: down
      run: |
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        for p in $($sudo ip netns pids "pdbd.${SLOT}" 2>/dev/null); do $sudo kill "$p" 2>/dev/null || true; done # kill the SUT while its netns still exists
        $sudo systemctl stop "pdbd.pppd@${SLOT}.service" "pdbd.socat@${SLOT}.service" "pdbd.netns@${SLOT}.service" >/dev/null 2>&1 || true

test:teardown:
  jobs:
    - name: stop
      run: |
        N=${N:-10}
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        for s in $(seq 0 $(( N - 1 ))); do
          for p in $($sudo ip netns pids "pdbd.$s" 2>/dev/null); do $sudo kill "$p" 2>/dev/null || true; done
          $sudo systemctl stop "pdbd.pppd@$s.service" "pdbd.socat@$s.service" "pdbd.netns@$s.service" >/dev/null 2>&1 || true
        done
        $sudo systemctl reset-failed 'pdbd.*' >/dev/null 2>&1 || true # socat/pppd exit non-zero when SIGTERM'd — clear it so the next campaign iteration starts clean

test:privileged:
  jobs:
    - name: check
      run: |
        set -eu
        [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null || { echo "privileged checks need root or passwordless sudo — see README 'Local development'"; exit 1; }
        command -v systemctl >/dev/null 2>&1 || { echo "privileged checks need systemd (systemctl not found)"; exit 1; }
