# #72 — see README "Benchmarks"
templates:
  nixsh: nix develop ../..#benchmark --no-update-lock-file -c sh

benchmark:link:
  piped: true
  jobs:
    - name: build
      root: "crates/transport/"
      run: |
        set -eu
        {nixsh} -c '
          set -eu
          cargo build --release --locked -p transport --example linkup --target "$MUSL_TARGET"
          cp "${CARGO_TARGET_DIR:-../../target}/$MUSL_TARGET/release/examples/linkup" bench/linkup
          ln -sfn "$BENCH_FIXTURE" bench/fixture
        '
    - name: incus
      root: "crates/transport/"
      run: |
        set -eu
        if command -v incus >/dev/null && sg incus-admin -c true 2>/dev/null; then exit 0; fi
        {nixsh} -c 'sudo -n "$BENCH_SETUP" "$(id -un)"'
    - name: run
      root: "crates/transport/"
      run: |
        set -eu
        out=$(mktemp -d)
        trap 'rm -rf "$out"' EXIT
        bencher=$({nixsh} -c 'command -v bencher')
        status=0
        sg incus-admin -c "'$bencher' run bench --out '$out/report.json'" || status=$?
        [ ! -s "$out/report.json" ] || {nixsh} -c 'jq -r -f bench/report.jq "$1"' _ "$out/report.json" >>"${BENCHMARK_REPORT:-/dev/stdout}"
        exit "$status"
