# #72 — see README "Benchmarks"
benchmark:link:
  piped: true
  jobs:
    - name: preflight
      run: lefthook run test:privileged
    - name: pppd
      root: "crates/transport/"
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        if [ -s pppd.pin ]; then src=$(cat pppd.pin) mode=pinned; else src=github:NixOS/nixpkgs/nixpkgs-unstable mode=floating; fi
        rev=$($sudo nix flake metadata --json "$src" | yq -p json .revision)
        ref="github:NixOS/nixpkgs/$rev#ppp"
        out=$($sudo nix build --no-link --print-out-paths "$ref")
        version=$($sudo nix eval --raw "$ref.version")
        $sudo install -d -m0755 /run/pdbd
        printf 'PPPD=%s/bin/pppd\nPPPD_VERSION=%s\nPPPD_SOURCE="%s (%s)"\n' "$out" "$version" "$ref" "$mode" | $sudo tee /run/pdbd/pppd.env >/dev/null
        echo "L2 comparator: pppd $version from $ref ($mode)"
    - name: fixtures
      run: |
        set -eu
        . /run/pdbd/pppd.env
        PPPD=$PPPD PROFILE=release lefthook run test:fixtures
    - name: pairings
      run: |
        set -eu
        . /run/pdbd/pppd.env
        SLOT=${SLOT:-0}
        DURATION=${DURATION:-10}
        export SLOT DURATION
        dir=$(mktemp -d); trap 'rm -rf "$dir"' EXIT
        mb() { yq -p json '.end.sum_received.bits_per_second / 1000000' "$1" 2>/dev/null | awk '{ printf "%.2f", $1 }'; }
        rtt() { sed -n 's|^rtt [^=]*= [^/]*/\([^/]*\)/.*|\1|p' "$1" 2>/dev/null; }
        rc=0
        for pairing in ${PAIRINGS:-pppd:pppd linkup:linkup linkup:pppd}; do
          near=${pairing%%:*} far=${pairing#*:}
          out="$dir/$near.$far"; mkdir -p "$out"
          NEAR=$near PEER=$far OUT=$out lefthook run benchmark:pairing || rc=1
          lefthook run benchmark:down >/dev/null 2>&1 || true
          bytes=0 cpu=0 ms=0
          for run in forward reverse parallel; do
            b=$(yq -p json '.end.sum_received.bytes // 0' "$out/$run.json" 2>/dev/null) || b=0
            c=$(cat "$out/$run.cpu" 2>/dev/null) || c=0
            m=$(yq -p json '.end | (.cpu_utilization_percent.host_total + .cpu_utilization_percent.remote_total) * .sum_received.seconds * 10' "$out/$run.json" 2>/dev/null) || m=0
            bytes=$(( bytes + ${b:-0} )) cpu=$(( cpu + ${c:-0} ))
            ms=$(awk -v a="$ms" -v b="${m:-0}" 'BEGIN { print a + b }')
          done
          host=$(awk -v j="$cpu" -v b="$bytes" -v hz="$(getconf CLK_TCK)" 'BEGIN { if (b > 0) printf "%.1f", j * 1000 / hz / (b / 1e6) }')
          proc=$(awk -v m="$ms" -v n="$(cat "$out/units.ns" 2>/dev/null)" -v b="$bytes" 'BEGIN { if (b > 0 && n != "") printf "%.1f", (m + n / 1e6) / (b / 1e6) }')
          printf '| %s ↔ %s | %s | %s | %s | %s | %s | %s | %s | %s |\n' "$near" "$far" "$(cat "$out/bringup" 2>/dev/null)" \
            "$(mb "$out/forward.json")" "$(mb "$out/reverse.json")" "$(mb "$out/parallel.json")" \
            "$(rtt "$out/idle.ping")" "$(rtt "$out/loaded.ping")" "$proc" "$host" >>"$dir/rows"
        done
        {
          printf '### transport\n\n'
          printf 'L1: a socat PTY pair (unpaced); L2: pppd %s from `%s`, linkup release build of `%s`. ' "$PPPD_VERSION" "$PPPD_SOURCE" "$(git rev-parse --short HEAD)"
          printf 'Pairings are near ↔ far: near runs in the netns and starts once far has opened its tty, → is near to far; bring-up is near start to IPCP Open at both ends (the far pppd sends its first ConfReq before the near tty opens and it is lost, so pppd ↔ pppd waits out the pppd 3 s restart timer). TCP is iperf3 for %ss per run, ×4 is four concurrent connections. ' "$DURATION"
          printf 'Loaded RTT is pinged during the → run; CPU is per MB received over the three runs: process CPU sums both iperf3 ends and the near, far and L1-bridge units but misses kernel PPP work done in kernel workers; host CPU is all busy time less the idle-ping baseline, which counts that work but is only meaningful on an otherwise idle host. A blank cell is a measurement that errored.\n\n'
          printf '| pairing | bring-up ms | → Mbit/s | ← Mbit/s | → ×4 Mbit/s | RTT idle ms | RTT loaded ms | process CPU ms/MB | host CPU ms/MB |\n'
          printf '| --- | --: | --: | --: | --: | --: | --: | --: | --: |\n'
          cat "$dir/rows"
        } >>"${BENCHMARK_REPORT:-/dev/stdout}"
        [ "$rc" = 0 ]

benchmark:pairing:
  piped: true
  jobs:
    - name: up
      root: "crates/transport/"
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        . /run/pdbd/linkup.env
        . /run/pdbd/pppd.env
        . ./.env
        ns="/var/run/netns/pdbd.${SLOT}"
        near="10.0.${SLOT}.1" far="10.0.${SLOT}.2"
        $sudo systemctl start "pdbd.netns@${SLOT}.service" "pdbd.socat@${SLOT}.service"
        for _ in $(seq 1 100); do $sudo test -e "/run/pdbd/${SLOT}/a" && break; sleep 0.1; done
        $sudo nsenter --net="$ns" ip link set lo up
        case $NEAR in
          pppd) set -- "$PPPD" "/run/pdbd/${SLOT}/a" "$PDBD_BAUD" noauth local nodetach nocrtscts novj noccp nolock debug lcp-echo-interval 0 unit $(( SLOT + 100 )) "${near}:${far}" ;; # unit offset: the far pppd holds unit SLOT and its /run/pppSLOT.pid
          linkup) set -- "$LINKUP" "/run/pdbd/${SLOT}/a" "$near" "$far" pdbd0 ;;
        esac
        case $PEER in pppd) dev="ppp${SLOT}" ;; linkup) dev="pdbd${SLOT}" ;; esac
        $sudo systemctl start "pdbd.${PEER}@${SLOT}.service"
        for _ in $(seq 1 100); do ip link show "$dev" >/dev/null 2>&1 && break; sleep 0.1; done # #24: a near ConfReq sent before the far tty opens is lost, and linkup never resends it
        t0=$(date +%s.%N)
        $sudo systemd-run --quiet --collect --unit="pdbd.near@${SLOT}" -p NetworkNamespacePath="$ns" -E PDBD_BAUD="$PDBD_BAUD" "$@"
        open() {
          case $2 in pppd) re='local +IP address' ;; linkup) re='phase: Open' ;; esac
          $sudo journalctl -q -o short-unix -u "$1" --since "@${t0%.*}" | awk -v t="$t0" -v re="$re" '$1 > t && $0 ~ re { print $1; exit }'
        }
        a= b=
        for _ in $(seq 1 300); do
          a=${a:-$(open "pdbd.near@${SLOT}" "$NEAR")}
          b=${b:-$(open "pdbd.${PEER}@${SLOT}" "$PEER")}
          [ -n "$a" ] && [ -n "$b" ] && break
          sleep 0.1
        done
        [ -n "$a" ] && [ -n "$b" ] || { echo "${NEAR} ↔ ${PEER}: L2 never opened (near ${a:-closed}, far ${b:-closed})"; exit 1; }
        awk -v a="$a" -v b="$b" -v t="$t0" 'BEGIN { printf "%.0f", ((a > b ? a : b) - t) * 1000 }' >"$OUT/bringup"
        for _ in $(seq 1 20); do $sudo nsenter --net="$ns" ping -c1 -W1 "$far" >/dev/null 2>&1 && exit 0; sleep 0.5; done
        echo "${NEAR} ↔ ${PEER}: L3 never answered after L2 opened"
        exit 1
    - name: measure
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        ns="/var/run/netns/pdbd.${SLOT}"
        far="10.0.${SLOT}.2"
        port=$(( 5201 + SLOT ))
        iperf3 -s -B "$far" -p "$port" >/dev/null 2>&1 &
        server=$!; trap 'kill "$server" 2>/dev/null || true' EXIT
        for _ in $(seq 1 50); do [ -n "$(ss -Hltn "src ${far}:${port}")" ] && break; sleep 0.1; done
        busy() { awk -v t="$(date +%s.%N)" '/^cpu / { print t, $2 + $3 + $4 + $7 + $8 + $9 }' /proc/stat; }
        idle=$(busy)
        $sudo nsenter --net="$ns" ping -q -c 20 -i 0.2 -W 5 "$far" >"$OUT/idle.ping"
        rate=$(busy | awk -v i="$idle" '{ split(i, a, " "); print ($2 - a[2]) / ($1 - a[1]) }')
        tcp() {
          name=$1; shift
          c=$(busy)
          $sudo nsenter --net="$ns" iperf3 -c "$far" -p "$port" -t "$DURATION" -J "$@" >"$OUT/$name.json"
          busy | awk -v c="$c" -v r="$rate" '{ split(c, a, " "); n = ($2 - a[2]) - r * ($1 - a[1]); printf "%d\n", (n > 0 ? n : 0) }' >"$OUT/$name.cpu"
        }
        { sleep 2; $sudo nsenter --net="$ns" ping -q -c $(( (DURATION - 3) * 5 )) -i 0.2 -W 10 "$far" >"$OUT/loaded.ping"; } &
        pinger=$!
        units() { $sudo systemctl show -P CPUUsageNSec "pdbd.near@${SLOT}" "pdbd.${PEER}@${SLOT}" "pdbd.socat@${SLOT}" | awk '{ n += $1 } END { print n }'; }
        u=$(units)
        tcp forward
        wait "$pinger"
        tcp reverse -R
        tcp parallel -P 4
        echo $(( $(units) - u )) >"$OUT/units.ns"

benchmark:down:
  jobs:
    - name: stop
      run: |
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n env PATH=$PATH"
        $sudo systemctl stop "pdbd.near@${SLOT}.service" >/dev/null 2>&1 || true
        N=$(( SLOT + 1 )) lefthook run test:teardown
