extends:
  - nix/lefthook.yml
  - bench/lefthook.yml
  - crates/transport/lefthook.*.yml

# Datapath test — #12-A
test:
  jobs:
    - name: unit
      run: cargo test -p transport --locked
    - name: datapath
      run: lefthook run test:datapath
      tags: [privileged]

benchmark:
  jobs:
    - name: link
      run: lefthook run benchmark:link
      tags:
        - privileged
