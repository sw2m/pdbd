extends:
  - crates/transport/lefthook.*.yml

build:
  jobs:
    - name: repro # #62
      run: |
        set -eu
        flake="git+file://$(git rev-parse --show-toplevel)?dir=crates/transport"
        nix build --no-update-lock-file --no-link "$flake"
        nix build --no-update-lock-file --no-link --rebuild "$flake"

build:update:
  jobs:
    - name: lock
      run: 'nix build --no-link "git+file://$(git rev-parse --show-toplevel)?dir=crates/transport"'

# Datapath test — #12-A
test:
  jobs:
    - { name: unit, run: cargo test -p transport --locked }
    - { name: datapath, run: lefthook run test:datapath, tags: [privileged] }
