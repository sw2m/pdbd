extends:
  - crates/transport/lefthook.*.yml

build:
  jobs:
    - name: cargo
      root: "crates/transport/"
      run: 'nix develop --no-update-lock-file "path:$PWD" -c cargo build -p transport --locked'

build:update:
  jobs:
    - name: rebuild
      root: "crates/transport/"
      run: 'nix develop "path:$PWD" -c cargo build -p transport --locked'

# Datapath test — #12-A
test:
  jobs:
    - { name: unit, run: cargo test -p transport --locked }
    - { name: datapath, run: lefthook run test:datapath, tags: [privileged] }
