extends:
  - lefthook.repro.yml
  - crates/transport/lefthook.*.yml

build:
  jobs:
    - name: repro # #62
      run: lefthook run repro crates/transport

build:update:
  jobs:
    - name: repro
      run: lefthook run repro crates/transport update

# Datapath test — #12-A
test:
  jobs:
    - { name: unit, run: cargo test -p transport --locked }
    - { name: datapath, run: lefthook run test:datapath, tags: [privileged] }
