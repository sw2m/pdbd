extends:
  - crates/transport/lefthook.*.yml

build:
  jobs:
    - name: repro # #62
      run: sh nix/repro.sh crates/transport

build:update:
  jobs:
    - name: repro
      run: sh nix/repro.sh crates/transport update

# Datapath test — #12-A
test:
  jobs:
    - { name: unit, run: cargo test -p transport --locked }
    - { name: datapath, run: lefthook run test:datapath, tags: [privileged] }
