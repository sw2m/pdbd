[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate

[dependencies]
ppproto = "0.2.1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "macros",
  "time",
  "sync"
] }
tun-rs = { version = "2", features = ["async"] }

[dev-dependencies]
tokio-serial = "5"  # linkup example only
clap = { workspace = true }  # linkup example only
dotenvy = { workspace = true }  # linkup example only
