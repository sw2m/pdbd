[package]
name = "socat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # internal crate

[dependencies]
fluent-uri = { workspace = true }
hostname-validator = { workspace = true }
idna = { workspace = true, optional = true }

[features]
default = ["idn"]
idn = [
  "dep:idna"
]  # UTS #46 host names; off, host names are RFC 1123 ASCII only (#29)

[dev-dependencies]
idna = { workspace = true }  # RFC 3986 URLs carry IDN hosts as A-labels
proptest = { workspace = true }
serde_json = { workspace = true }  # examples/verdict.rs speaks JSON lines to the benchmark runner
