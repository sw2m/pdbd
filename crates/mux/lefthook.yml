extends:
  - nix/lefthook.yml

test:
  jobs:
    - name: cargo
      run: cargo test -p mux --locked

# #58 — see crates/mux/CLAUDE.md §"Benchmarks"
benchmark:
  jobs:
    - name: compare
      run: |
        pkgs=github:NixOS/nixpkgs/nixpkgs-unstable # unlocked on purpose: the benchmark races the latest toolchains
        nix shell "$pkgs#go" "$pkgs#dotnet-sdk" "$pkgs#cargo" "$pkgs#rustc" "$pkgs#gcc" -c sh crates/mux/peers/compare.sh
