[workspace]
resolver = "2"
members = ["crates/proto", "crates/pdbd", "crates/pdb", "crates/link"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sw2m/pdbd"

[workspace.dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
