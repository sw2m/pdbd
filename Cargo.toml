[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/pdbd",
  "crates/pdb",
  "crates/socat",
  "crates/transport"
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sw2m/pdbd"

[workspace.dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
clap = { version = "4", features = ["derive", "env"] }  # env feature enables #[arg(env = ...)]
dotenvy = "0.15"  # loads .env into the process env for clap's #[arg(env)] to read
proptest = "1"
serde_json = "1"
fluent-uri = { version = "0.4", default-features = false, features = ["net"] }  # RFC 3986 validation without std or alloc (#29)
idna = { version = "1", default-features = false, features = [
  "alloc",
  "compiled_data"
] }  # UTS #46 without std (#29)
hostname-validator = "1"  # RFC 1123 host names without the idn feature, core only (#29)

[patch.crates-io]
ppproto = { git = "https://github.com/sw2m/ppproto", rev = "2a608947e49aa0c35ca8195dddf1d7167751c8aa" }  # #45: peer-input panics; drop once embassy-rs/ppproto#8 is released
