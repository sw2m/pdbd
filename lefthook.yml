# CI checks — see README "Local development".
no_tty: true
extends:
  - lefthook.*.yml

# Fan a hook out across the crates that define it + its non-noop <hook>:root.
# {1}=hook, {2}=mode (plan prints the leaves, else runs every leaf and fails if any is red).
# GHA reads the plan with LEFTHOOK_OUTPUT=execution_out — see .github/workflows/ci.yml.
fanout:
  jobs:
    - name: fanout
      run: |
        hook="{1}"
        plan() {
          for f in crates/*/lefthook.yml; do
            [ "$(LEFTHOOK_CONFIG="$f" lefthook dump | yq "has(\"$hook\")")" = true ] \
              && printf '%s\t%s\t%s\n' "$hook ($(basename "$(dirname "$f")"))" "$f" "$hook"
          done
          for leaf in lefthook.*.yml; do
            [ "$(yq "has(\"$hook:root\")" "$leaf")" = true ] || continue
            [ "$(yq "[.\"$hook:root\".jobs[].run] | all_c(. == \"true\")" "$leaf")" != true ] \
              && printf '%s\t%s\t%s\n' "$hook:root" lefthook.yml "$hook:root"
            break
          done
        }
        run() {
          red=""
          while IFS="$(printf '\t')" read -r name cfg h; do
            [ -n "$h" ] || continue
            LEFTHOOK_CONFIG="$cfg" lefthook run "$h" </dev/null || red="$red  $name\n"
          done <<EOF
        $(plan)
        EOF
          [ -z "$red" ] && return
          printf 'fanout: red leaves:\n%b' "$red" >&2
          return 1
        }
        case "{2}" in
          plan) plan ;;
          *)    run ;;
        esac

quality:
  jobs:
    - name: fanout
      run: lefthook run fanout quality
build:
  jobs:
    - name: fanout
      run: lefthook run fanout build
build:update:
  jobs:
    - name: fanout
      run: lefthook run fanout build:update
test:
  jobs:
    - name: fanout
      run: lefthook run fanout test
vuln:
  jobs:
    - name: fanout
      run: lefthook run fanout vuln
governance:
  jobs:
    - name: fanout
      run: lefthook run fanout governance
benchmark:
  jobs:
    - name: fanout
      run: lefthook run fanout benchmark

ci:
  jobs:
    - name: quality
      run: lefthook run quality
    - name: build
      run: lefthook run build
    - name: test
      run: lefthook run test
    - name: vuln
      run: lefthook run vuln
    - name: governance
      run: lefthook run governance
    - name: benchmark # #71
      run: lefthook run benchmark
      tags: [benchmark]
