# CI checks, run through the flake `ci` entrypoint — see README "Local development".
extends:
  - ./lefthook.format.yml
  - ./lefthook.lint.yml
  - ./lefthook.build.yml
  - ./lefthook.unit.yml
  - ./lefthook.transport.yml

quality:
  jobs:
    - { name: format, run: lefthook run format }
    - { name: lint, run: lefthook run lint }

test:
  jobs:
    - { name: unit, run: lefthook run unit }
    - { name: transport, tags: [privileged], run: lefthook run transport }

vuln:
  jobs:
    - { name: stub, run: 'echo "vuln: no scanners wired yet (home reserved)"' }

governance:
  jobs:
    - { name: stub, run: 'echo "governance: reserved"' }

ci:
  jobs:
    - { name: quality, run: lefthook run quality }
    - { name: build, run: lefthook run build }
    - { name: test, run: lefthook run test }
    - { name: vuln, run: lefthook run vuln }
    - { name: governance, run: lefthook run governance }

pre-commit:
  jobs:
    - { name: quality, run: lefthook run quality }
pre-push:
  jobs:
    - { name: ci, env: { LEFTHOOK_EXCLUDE: privileged }, run: lefthook run ci }
