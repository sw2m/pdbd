# buf breaking is deliberately absent until the pdbd.v1 contract freezes — #21.
ci:
  parallel: false # the cargo commands share the target lock
  commands:
    fmt:
      run: cargo fmt --check
    clippy:
      run: cargo clippy --all-targets -- -D warnings
    build:
      run: cargo build --locked
    buf-lint:
      run: buf lint
    buf-format:
      run: buf format --diff --exit-code

# Privileged link tests — need root (TUN + pppd + netns), so NOT part of the
# unprivileged `ci` group. Invoke manually or from a privileged runner:
# `lefthook run link` (deps come from the flake devShell).
link:
  commands:
    ping:
      run: N=10 crates/link/harness/ping.sh
