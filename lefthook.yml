# One CI definition, segmented across per-action files merged with `extends`
# (lefthook's config include — no per-stage LEFTHOOK_CONFIG switching). Each hook
# holds `jobs`; a job is a command or a `group`. Stages compose the action hooks by
# recursion (`lefthook run <action>`). The `build` stage is the `build` action
# itself (lefthook.build.yml), so it has no stanza here. buf-breaking stays absent
# until the pdbd.v1 contract freezes — #21.
extends:
  - ./lefthook.format.yml
  - ./lefthook.lint.yml
  - ./lefthook.build.yml
  - ./lefthook.unit.yml
  - ./lefthook.transport.yml

quality:
  jobs:
    - { name: format, run: lefthook run format }
    - { name: lint, run: lefthook run lint }

test:
  jobs:
    - { name: unit, run: lefthook run unit }
    - { name: transport, tags: [privileged], run: lefthook run transport }

vuln:
  jobs:
    - { name: stub, run: 'echo "vuln: no scanners wired yet (home reserved)"' }

governance:
  jobs:
    - { name: stub, run: 'echo "governance: reserved"' }

ci:
  jobs:
    - { name: quality, run: lefthook run quality }
    - { name: build, run: lefthook run build }
    - { name: test, run: lefthook run test }
    - { name: vuln, run: lefthook run vuln }
    - { name: governance, run: lefthook run governance }

pre-commit:
  jobs:
    - { name: quality, run: lefthook run quality }
pre-push:
  jobs:
    # the full suite minus the privileged transport test — that runs on the privileged CI lane
    - { name: ci, env: { LEFTHOOK_EXCLUDE: privileged }, run: lefthook run ci }
