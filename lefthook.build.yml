build:root:
  jobs:
    - name: repro # #62
      run: lefthook run repro .
    - name: shell
      run: 'nix develop --no-update-lock-file "path:$PWD" -c true'
build:update:root:
  jobs:
    - name: repro
      run: lefthook run repro . update
    - name: shell
      run: 'nix develop "path:$PWD" -c true'
