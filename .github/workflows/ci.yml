name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Two lanes, same one definition. `checks` is everything except the privileged
  # link test; `link` is that test alone (TUN + pppd + netns need root). Both run
  # `nix develop -c lefthook run …`, identical to local.
  ci:
    runs-on: ubuntu-latest
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: checks
            run: LEFTHOOK_EXCLUDE=privileged nix develop -c lefthook run ci --all-files
          - lane: link
            run: LEFTHOOK_CONFIG=lefthook.link.yml nix develop -c lefthook run ping
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # A cached /nix store trades the clean-runner ideal for speed. It is allowed,
      # but the reuse is announced (next step) so possible build pollution stays
      # visible rather than silent.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        id: cache
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: warn on reused components
        if: steps.cache.outputs.hit == 'true'
        run: echo "::warning title=non-clean runner::restored a cached /nix store from a prior run — the clean-runner ideal was traded for speed, so component reuse means build pollution is possible"
      - run: ${{ matrix.run }}
