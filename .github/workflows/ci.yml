name: ci

on:
  pull_request:
    # No `opened`: a non-draft open would race draft-guard and fire CI once before
    # it re-drafts. CI runs when a draft is marked ready (ready_for_review) or on a
    # push (synchronize). Drafts are skipped below regardless.
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # The checks are lefthook's: `fanout <hook> plan` emits each leaf; LEFTHOOK_OUTPUT=execution_out
  # strips the report so the output is clean TSV. Nothing here names a check.
  discover:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - id: list
        run: |
          checks=$(
            for x in $(nix develop --no-update-lock-file -c yq '.ci.jobs[].name' lefthook.yml); do
              LEFTHOOK_OUTPUT=execution_out nix develop --no-update-lock-file -c lefthook run fanout "$x" plan --no-auto-install 2>/dev/null
            done | { printf 'name\tconfig\thook\n'; cat; } | nix develop --no-update-lock-file -c yq -p=tsv -o=json -I=0
          )
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    runs-on: ubuntu-latest
    name: ${{ matrix.check.name }}
    strategy:
      fail-fast: false # report every check, don't cancel siblings on first red
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        id: cache
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: warn on reused components
        if: steps.cache.outputs.hit == 'true'
        run: echo "::warning title=non-clean runner::restored a cached /nix store from a prior run — component reuse means build pollution is possible"
      - id: images
        if: matrix.check.hook == 'benchmark'
        env:
          CONFIG: ${{ matrix.check.config }}
        run: |
          crate=$(basename "$(dirname "$CONFIG")")
          mkdir -p ~/.cache/bencher/images
          echo "prefix=bencher-images-$RUNNER_OS-$crate-" >> "$GITHUB_OUTPUT"
          echo "report=$(dirname "$CONFIG")/bench/report.json" >> "$GITHUB_OUTPUT"
      - id: restore
        if: matrix.check.hook == 'benchmark'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bencher/images
          key: ${{ steps.images.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.images.outputs.prefix }}
      - name: warn on reused images
        if: steps.restore.outputs.cache-matched-key != ''
        run: |
          echo "::warning title=cached runner image::restored bencher images from ${{ steps.restore.outputs.cache-matched-key }}: a hit races the oracles that image was provisioned with — see README \"Benchmarks\""
          ls ~/.cache/bencher/images > "$RUNNER_TEMP/bencher.restored"
      - env:
          LEFTHOOK_CONFIG: ${{ matrix.check.config }}
        run: |
          [ "${{ matrix.check.hook }}" != benchmark ] || export BENCHMARK_REPORT="$RUNNER_TEMP/benchmark.md" # see README "Benchmarks"
          nix develop --no-update-lock-file -c lefthook run ${{ matrix.check.hook }}
      - id: keep
        if: always() && matrix.check.hook == 'benchmark'
        env:
          REPORT: ${{ steps.images.outputs.report }}
        run: |
          key=$(jq -r '.cache.key // ""' "$REPORT" 2>/dev/null || true)
          base=$(jq -r '.cache.base.key // ""' "$REPORT" 2>/dev/null || true)
          [ -n "$key" ] || exit 0
          cd ~/.cache/bencher/images
          find . -maxdepth 1 -type f ! -name "$key.tar" ! -name "$key.sha256" \
            ! -name "${base:-$key}.tar" ! -name "${base:-$key}.sha256" -delete
          ls | cmp -s - "$RUNNER_TEMP/bencher.restored" 2>/dev/null || echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: always() && steps.keep.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bencher/images
          key: ${{ steps.images.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: summarize benchmark report
        if: always() && matrix.check.hook == 'benchmark'
        run: '[ ! -f "$RUNNER_TEMP/benchmark.md" ] || cat "$RUNNER_TEMP/benchmark.md" >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.check.hook == 'benchmark'
        with:
          name: benchmark-${{ strategy.job-index }}
          path: ${{ runner.temp }}/benchmark.md
          if-no-files-found: ignore

  # Not in mergeable's needs: a failed comment never blocks a merge — see README "Benchmarks"
  report:
    needs: check
    if: >-
      always() && github.event_name == 'pull_request' && needs.check.result != 'skipped'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: benchmark-*
          path: reports
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          reports=$(find reports -name '*.md' 2>/dev/null | sort)
          [ -n "$reports" ] || { echo "no benchmark reports"; exit 0; }
          marker='<!-- pdbd-benchmark -->'
          {
            printf '%s\n## Benchmarks\n\nResults for %s.\n\n' "$marker" "$SHA"
            for f in $reports; do cat "$f"; echo; done
          } > body.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md --silent
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md --silent
          fi

  # The one status to mark required — #65
  mergeable:
    needs: [discover, check]
    if: always() # report on drafts too, so the status is never stuck "expected"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "discover=${{ needs.discover.result }} check=${{ needs.check.result }}"
          [ "${{ needs.discover.result }}" = success ] || exit 1
          [ "${{ needs.check.result }}" = success ] || exit 1
