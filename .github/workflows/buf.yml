name: buf

on:
  push:
    branches: [main]
    paths: ['proto/**', 'buf.yaml', 'buf.lock', '.github/workflows/buf.yml']
  pull_request:
    paths: ['proto/**', 'buf.yaml', 'buf.lock', '.github/workflows/buf.yml']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0          # pinned to the drive's vendored buf (tooling/bin/buf)
          github_token: ${{ github.token }}
      - run: buf lint
      - run: buf format --diff --exit-code
      # `buf breaking` is intentionally omitted while pre-implementation — the
      # contract is still being shaped, so every design refinement is a "break".
      # It turns on (against the prior tag) once the pdbd.v1 surface is frozen.
