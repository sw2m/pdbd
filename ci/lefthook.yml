# CI checks, run through the flake `ci` entrypoint — see README "Local development".
# This lives in ci/ (not the repo root), so `ci` points lefthook here via
# LEFTHOOK_CONFIG; bare `lefthook` needs that env set too. The extended paths are
# repo-root-relative — lefthook resolves `extends` from the root, not this file's dir.
no_tty: true # no spinner/cursor animation — it's just log noise (the recursed runs inherit this)
extends:
  - ci/lefthook.format.yml
  - ci/lefthook.lint.yml
  - ci/lefthook.build.yml
  - ci/lefthook.unit.yml

quality:
  jobs:
    - { name: format, run: lefthook run format }
    - { name: lint, run: lefthook run lint }

test:
  jobs:
    - { name: unit, run: lefthook run unit }

vuln:
  jobs:
    - { name: stub, run: 'echo "vuln: no scanners wired yet (home reserved)"' }

governance:
  jobs:
    - { name: stub, run: 'echo "governance: reserved"' }

ci:
  jobs:
    - { name: quality, run: lefthook run quality }
    - { name: build, run: lefthook run build }
    - { name: test, run: lefthook run test }
    - { name: vuln, run: lefthook run vuln }
    - { name: governance, run: lefthook run governance }

pre-commit:
  jobs:
    - { name: quality, run: lefthook run quality }
pre-push:
  jobs:
    - { name: ci, run: lefthook run ci }
