# Datapath test (#12-A) — privileged (sudo + systemd); git hooks skip it via the privileged tag.
test:transport:
  piped: true
  jobs:
    - { name: preflight, run: lefthook run is-privileged }
    - name: units
      run: |
        set -eu
        "${SYSTEMCTL:-systemctl}" cat 'pdbd.rig@.target' >/dev/null 2>&1 || { echo "units not installed — run via 'nix develop -c ci', not bare lefthook"; exit 1; }
    - name: build
      run: |
        set -eu
        cargo build -q -p transport --example linkup
        bin=$(find "$(git rev-parse --show-toplevel)/target" -type f -name linkup -path '*debug/examples*' | head -1)
        [ -n "$bin" ]
        sudo -n install -d -m0755 /run/pdbd
        printf 'LINKUP=%s\n' "$bin" | sudo -n tee /run/pdbd/linkup.env >/dev/null
    - name: fanout
      run: |
        set -eu
        N=${N:-10} # the rig's from-scratch campaign sample; override with `N=3 lefthook run test:transport`
        pids=""
        for s in $(seq 0 $(( N - 1 ))); do SLOT=$s lefthook run test:transport:attempt & pids="$pids $!"; done
        rc=0; for p in $pids; do wait "$p" || rc=1; done
        N=$N lefthook run test:transport:teardown >/dev/null 2>&1 || true # catch-all: reclaim a slot whose attempt failed before its own `down`
        [ "$rc" = 0 ]

test:transport:attempt:
  piped: true
  jobs:
    - name: up
      run: |
        set -eu
        sudo -n "${SYSTEMCTL:-systemctl}" start "pdbd.rig@${SLOT}.target"
        . /run/pdbd/linkup.env # LINKUP=<built example>, from the build step
        sudo -n "${IP:-ip}" netns exec "pdbd.${SLOT}" "$LINKUP" "/run/pdbd/${SLOT}/a" "10.0.${SLOT}.1" "10.0.${SLOT}.2" pdbd0 >/dev/null 2>&1 &
    - name: run
      run: |
        set -eu
        for _ in $(seq 1 20); do
          sudo -n "${IP:-ip}" netns exec "pdbd.${SLOT}" "${PING:-ping}" -c1 -W1 "10.0.${SLOT}.2" >/dev/null 2>&1 && { echo "slot ${SLOT}: PASS"; exit 0; }
          sleep 0.5
        done
        echo "slot ${SLOT}: FAIL"; exit 1
    - name: down
      run: |
        ip="${IP:-ip}"
        for p in $(sudo -n "$ip" netns pids "pdbd.${SLOT}" 2>/dev/null); do sudo -n kill "$p" 2>/dev/null || true; done # kill the SUT while its netns still exists
        sudo -n "${SYSTEMCTL:-systemctl}" stop "pdbd.rig@${SLOT}.target" >/dev/null 2>&1 || true

test:transport:teardown:
  jobs:
    - name: stop
      run: |
        N=${N:-10}
        sc="${SYSTEMCTL:-systemctl}"; ip="${IP:-ip}"
        for s in $(seq 0 $(( N - 1 ))); do
          for p in $(sudo -n "$ip" netns pids "pdbd.$s" 2>/dev/null); do sudo -n kill "$p" 2>/dev/null || true; done
          sudo -n "$sc" stop "pdbd.rig@$s.target" >/dev/null 2>&1 || true
        done
        sudo -n "$sc" reset-failed 'pdbd.*' >/dev/null 2>&1 || true # socat/pppd exit non-zero when SIGTERM'd — clear it so the next campaign iteration starts clean