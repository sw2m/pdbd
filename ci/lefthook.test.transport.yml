# Datapath test (#12-A), systemd form. Per-daemon ordering now lives in the unit
# graph (pdbd.datapath@<slot> Requires/After: netns -> socat -> pppd -> linkup),
# so the lefthook steps are the lifecycle PHASES, not per-daemon. The per-slot
# units are independent, so `up` fans out P instances in parallel. Prototype;
# wired into the `test` stage in PR 2.
transport:
  piped: true
  jobs:
    - name: build
      run: |
        set -eu
        cargo build -q -p transport --example linkup
        bin=$(find "$(git rev-parse --show-toplevel)/target" -type f -name linkup -path '*debug/examples*' | head -1)
        [ -n "$bin" ]
        sudo -n install -d -m0755 /run/pdbd
        printf 'LINKUP=%s\n' "$bin" | sudo -n tee /run/pdbd/linkup.env >/dev/null
    - name: campaign
      env:
        P: 4 # parallel datapath instances (slots); override with P_OVERRIDE
      run: |
        set -eu
        export P=${P_OVERRIDE:-$P}
        lefthook run up
        if lefthook run verify; then rc=0; else rc=1; fi
        lefthook run teardown >/dev/null 2>&1 || true   # always reclaim, pass or fail
        exit $rc

# phases — each separately runnable; `campaign` drives them and guarantees teardown
up:
  jobs:
    - name: start
      run: |
        set -eu
        for s in $(seq 0 $(( ${P:-4} - 1 ))); do sudo -n systemctl start "pdbd.datapath@$s.target" & done
        wait   # P isolated datapaths come up concurrently

verify:
  jobs:
    - name: ping
      run: |
        set -eu
        rc=0
        for s in $(seq 0 $(( ${P:-4} - 1 ))); do
          ok=0
          for _ in $(seq 1 20); do sudo -n ip netns exec "pdbd.$s" ping -c1 -W1 "10.0.$s.2" >/dev/null 2>&1 && { ok=1; break; }; sleep 0.5; done
          [ "$ok" = 1 ] && echo "slot $s: PASS" || { echo "slot $s: FAIL"; rc=1; }
        done
        [ "$rc" = 0 ]

teardown:
  jobs:
    - name: stop
      run: |
        for s in $(seq 0 $(( ${P:-4} - 1 ))); do sudo -n systemctl stop "pdbd.datapath@$s.target" >/dev/null 2>&1 || true; done
