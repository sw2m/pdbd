# Datapath test (#12-A) — privileged (sudo + systemd); git hooks skip it via the privileged tag.
test:transport:
  piped: true
  jobs:
    - { name: preflight, run: lefthook run is-privileged }
    - name: fixtures
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n"
        for u in ci/systemd/pdbd.netns@.service ci/systemd/pdbd.socat@.service ci/systemd/pdbd.pppd@.service; do
          minijinja-cli -D ip="$(command -v ip)" -D socat="$(command -v socat)" -D pppd="$(command -v pppd)" -D sh="$(command -v sh)" "$u" \
            | $sudo tee "/run/systemd/system/$(basename "$u")" >/dev/null
        done
        $sudo systemctl daemon-reload
    - name: build
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n"
        cargo build -q -p transport --example linkup
        bin=$(find "$(git rev-parse --show-toplevel)/target" -type f -name linkup -path '*debug/examples*' | head -1)
        [ -n "$bin" ]
        $sudo install -d -m0755 /run/pdbd
        printf 'LINKUP=%s\n' "$bin" | $sudo tee /run/pdbd/linkup.env >/dev/null
    - name: fanout
      run: |
        set -eu
        N=${N:-10} # the rig's from-scratch campaign sample; override with `N=3 lefthook run test:transport`
        pids=""
        for s in $(seq 0 $(( N - 1 ))); do SLOT=$s lefthook run test:transport:attempt & pids="$pids $!"; done
        rc=0; for p in $pids; do wait "$p" || rc=1; done
        N=$N lefthook run test:transport:teardown >/dev/null 2>&1 || true # catch-all: reclaim a slot whose attempt failed before its own `down`
        [ "$rc" = 0 ]

test:transport:attempt:
  piped: true
  jobs:
    - name: up
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n"
        ns="/var/run/netns/pdbd.${SLOT}"
        $sudo systemctl start "pdbd.netns@${SLOT}.service" "pdbd.pppd@${SLOT}.service" # pppd pulls socat
        $sudo nsenter --net="$ns" ip link set lo up
        . /run/pdbd/linkup.env # LINKUP=<built example>, from the build step
        $sudo nsenter --net="$ns" "$LINKUP" "/run/pdbd/${SLOT}/a" "10.0.${SLOT}.1" "10.0.${SLOT}.2" pdbd0 >/dev/null 2>&1 &
    - name: run
      run: |
        set -eu
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n"
        for _ in $(seq 1 20); do
          $sudo nsenter --net="/var/run/netns/pdbd.${SLOT}" ping -c1 -W1 "10.0.${SLOT}.2" >/dev/null 2>&1 && { echo "slot ${SLOT}: PASS"; exit 0; }
          sleep 0.5
        done
        echo "slot ${SLOT}: FAIL"; exit 1
    - name: down
      run: |
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n"
        for p in $($sudo ip netns pids "pdbd.${SLOT}" 2>/dev/null); do $sudo kill "$p" 2>/dev/null || true; done # kill the SUT while its netns still exists
        $sudo systemctl stop "pdbd.pppd@${SLOT}.service" "pdbd.socat@${SLOT}.service" "pdbd.netns@${SLOT}.service" >/dev/null 2>&1 || true

test:transport:teardown:
  jobs:
    - name: stop
      run: |
        N=${N:-10}
        sudo=; [ "$(id -u)" != 0 ] && sudo="sudo -n"
        for s in $(seq 0 $(( N - 1 ))); do
          for p in $($sudo ip netns pids "pdbd.$s" 2>/dev/null); do $sudo kill "$p" 2>/dev/null || true; done
          $sudo systemctl stop "pdbd.pppd@$s.service" "pdbd.socat@$s.service" "pdbd.netns@$s.service" >/dev/null 2>&1 || true
        done
        $sudo systemctl reset-failed 'pdbd.*' >/dev/null 2>&1 || true # socat/pppd exit non-zero when SIGTERM'd — clear it so the next campaign iteration starts clean