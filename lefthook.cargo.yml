# cargo leaves — run under `LEFTHOOK_CONFIG=lefthook.cargo.yml`; the file is the
# namespace, so each hook is a single word. The root lefthook.yml stages recurse
# here.
fmt:
  commands:
    fmt: { run: cargo fmt --check }
clippy:
  commands:
    clippy: { run: cargo clippy --all-targets -- -D warnings }
build:
  commands:
    build: { run: cargo build --locked }
test:
  commands:
    test: { run: cargo test }
